<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://ddragon.leagueoflegends.com" />
    <title>League Coach</title>
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body>
    <aside id="panel">
      <header>League Coach <span id="phase">idle</span></header>
      <section id="roster" hidden>
        <h2>Your team</h2>
        <div id="allies" class="champs"></div>
        <h2>Enemies</h2>
        <div id="enemies" class="champs"></div>
        <p id="tip" class="tip" hidden></p>
      </section>
      <section id="draft" hidden>
        <h2>Ban suggestions</h2>
        <ul id="bans"></ul>
        <h2>Pick suggestions</h2>
        <ul id="picks"></ul>
        <ul id="draft-notes" class="notes"></ul>
      </section>
      <section id="game" hidden>
        <h2>Objectives</h2>
        <ul id="timers"></ul>
        <p id="skill" class="highlight"></p>
        <h2>Build reminders</h2>
        <ul id="builds" class="notes"></ul>
      </section>
      <footer id="status"></footer>
    </aside>
    <script src="../dist/renderer/overlay.js"></script>
  </body>
</html>
